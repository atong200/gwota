; Export presets for the release builds (see .github/workflows/release.yml).
; Card data is plain JSON read at runtime, so it is listed in include_filter to ship inside the pack.
; Local export: godot --headless --path game --export-release "Windows Desktop" build/windows/Gwota.exe

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/**/*.json"
exclude_filter="build/*"
export_path="build/windows/Gwota.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=true
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/file_version="0.1.0"
application/product_version="0.1.0"
application/product_name="Gwota"
application/file_description="Gwota - a Dota 2 themed Gwent-style card game"
application/copyright=""
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/**/*.json"
exclude_filter="build/*"
export_path="build/linux/Gwota.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
binary_format/architecture="x86_64"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
